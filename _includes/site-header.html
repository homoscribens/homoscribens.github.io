<header class="site-header">
  <div class="header-inner">
    <a class="site-name" href="{{ '/' | relative_url }}">{{ site.author.name }}</a>
    <nav aria-label="Main navigation"><ul>
      {% for link in site.data.navigation.main %}<li><a href="{{ link.url | relative_url }}"{% if page.url == link.url %} aria-current="page"{% endif %}>{{ link.title }}</a></li>{% endfor %}
    </ul></nav>
  </div>
</header>
