---
layout: default
---
<main id="main-content" class="site-main page-main">
  <header class="page-header">
    <p class="page-eyebrow">{{ site.author.name }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.intro %}<p>{{ page.intro }}</p>{% endif %}
  </header>
  <div class="page-content">{{ content }}</div>
</main>
